server:
  port: 8080

spring:
  application:
    name: problem-service
  datasource:
    url: jdbc:h2:mem:problemdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
