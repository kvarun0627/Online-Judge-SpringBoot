server:
  port: 8080

spring:
  application:
    name: problem-service
  datasource:
    # Local default: localhost:5432. docker-compose overrides this via the
    # SPRING_DATASOURCE_URL env var to point at the `postgres` service name.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/problemdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
